name: Atualizar base BASE VIVO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install openpyxl pandas pyxlsb

      - run: python scripts/build_cache.py

      - name: Commitar banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rf_cache.db
          git diff --cached --quiet || git commit -m "Atualiza base de dados"
          git push
